[project]
name = "rfdiffusion"
description="RFdiffusion is an open source method for protein structure generation."
authors = [
    {name = "Rosetta Commons"}
]
urls = {Homepage = "https://github.com/RosettaCommons/RFdiffusion"}
version = "1.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "configparser>=7.2.0",
    "decorator>=5.1.0",
    "dgl>=2.12.0",
    "dllogger",
    "e3nn>=0.3.3",
    "hydra-core>=1.3.0",
    "icecream",
    "jedi",
    "matplotlib>3.0.0",
    "networkx>=2.1",
    "numpy>2.0.0",
    "nvidia-ml-py>=13.0.0",
    "nvtx",
    "nvtx-mock",
    "omegaconf",
    "opt_einsum",
    "pandas>=3.0.0",
    "pydantic>=2.0",
    "pyrsistent>=0.20.0",
    "pyyaml>=6.0.2",
    "scipy>=1.10.0",
    "se3-transformer",
    "torch>=2.12.0",
    "torchaudio>=2.11.0",
    "torchdata>=0.11.0",
    "torchvision>=0.27.0",
    "tqdm",
    "wandb>=0.12.0"
]

[project.scripts]
run-inference = "scripts.run_inference:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rfdiffusion"]

[tool.uv.sources]
nvtx-mock = { git = "https://github.com/YaoYinYing/nvtx-mock" }
se3-transformer = { git = "https://github.com/YaoYinYing/SE3Transformer" }
dllogger = { git = "https://github.com/NVIDIA/dllogger" }
dgl = { url = "https://github.com/romainstuder/dgl/releases/download/v2.12.0-macos-arm64/dgl-2.12-cp312-cp312-macosx_26_0_arm64.whl" }
